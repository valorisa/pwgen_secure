name: Pylint

on:
  push:
  pull_request:

jobs:
  pylint:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U pylint

      - name: Clear pylint cache (safe)
        run: python -m pylint --clear-cache || true

      - name: Disk usage (debug)
        run: |
          df -h
          du -sh . || true

      - name: Analysing the code with pylint (repo files only)
        run: |
          # Lint only tracked .py files and exclude virtualenv and large folders
          FILES="$(git ls-files '*.py' | grep -v -E '(^tests/|(^|/)\.venv/|(^|/)(venv|.venv)/)')"
          echo "Files to lint:"
          echo "$FILES"
          if [ -n "$FILES" ]; then
            python -m pylint $FILES
          else
            echo "No Python files to lint"
          fi

      - name: Clean up (non-fatal)
        run: |
          rm -rf .pylint.d || true
          rm -rf __pycache__ || true
